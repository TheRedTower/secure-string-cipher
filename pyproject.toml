[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "secure-string-cipher"
version = "3.0.0.dev0"
description = "Local file encryption where every file carries its own access rules"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TheRedTower" }]
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/TheRedTower/secure-string-cipher"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.uv]
required-version = ">=0.9.17"
# argon2-cffi-bindings 26.2.0 was days old when this was pinned; hold the
# last release that had been out for weeks.
constraint-dependencies = ["argon2-cffi-bindings==26.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/secure_string_cipher"]

[tool.hatch.build.targets.sdist]
# An allowlist, so legacy/, rebuild/ and untracked local files never ship.
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
