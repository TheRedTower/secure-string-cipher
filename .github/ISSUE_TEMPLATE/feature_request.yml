name: Feature request
description: Propose a focused improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Security-sensitive proposals may need
        a smaller design discussion before implementation.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and the roadmap for a similar proposal.
          required: true
        - label: This request does not disclose a security vulnerability or sensitive data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behaviour without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility considerations
      description: Note effects on formats, keys, passphrases, metadata, existing files, or supported platforms.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you considered?
