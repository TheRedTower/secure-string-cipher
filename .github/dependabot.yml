version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      routine-python-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "cryptography"
          - "argon2-cffi*"
          - "pynacl"
          - "keyring"
          - "pyperclip"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    open-pull-requests-limit: 5
    groups:
      routine-github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "pypa/gh-action-pypi-publish"
          - "softprops/action-gh-release"
          - "docker/login-action"
          - "docker/build-push-action"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "docker"
    labels:
      - "docker"
    open-pull-requests-limit: 3
