name: CI

on:
  push:
    branches: ["v3"]
  # Every PR, so stacked PRs (whose base is another step's branch) are checked too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.17"

      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  docker:
    # Builds the image and runs the guided flow and the scripted flows in
    # it (tests/docker). Linux only: the image is a Linux image.
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.17"

      - run: docker build --pull -t ssc:ci .
      - run: uv sync --locked
      - run: uv run --locked pytest tests/docker
        env:
          SSC_DOCKER_IMAGE: ssc:ci

  test:
    # Type checks run per platform too, since mypy evaluates sys.platform
    # branches differently on each OS.
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.17"

      - run: uv sync --locked
      - run: uv run --locked mypy
      # The real-keychain test (tests/vault/test_keychain.py) runs on every
      # OS: macOS Keychain and Windows Credential Manager are there already,
      # and Linux gets Secret Service from an unlocked gnome-keyring.
      - if: runner.os != 'Linux'
        run: uv run --locked pytest
        env:
          SSC_KEYCHAIN_TESTS: "1"

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring dbus
          dbus-run-session -- bash -c '
            # A non-empty password creates and unlocks the login collection
            # without a prompt, which a headless runner cannot show.
            printf "ci-keychain" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            uv run --locked pytest
          '
        env:
          SSC_KEYCHAIN_TESTS: "1"
