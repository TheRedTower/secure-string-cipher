name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same PR/branch, but
# never cancel a run already in progress on main — that history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Derandomizes Hypothesis (tests/conftest.py) so this release gate produces
  # the same examples every run instead of going red on Tuesday and green on
  # Wednesday for identical code. A separate nightly workflow runs the suite
  # with fresh randomized examples instead, since derandomizing everywhere
  # would mean never exploring a new one again.
  HYPOTHESIS_PROFILE: ci

jobs:
  # Fast quality checks on Python 3.14 only - runs first
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.14"
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.9.17"
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked)
      run: uv sync --extra dev --locked

    - name: Check code quality (Ruff)
      run: uv run --locked ruff check src tests tools

    - name: Check formatting (Ruff)
      run: uv run --locked ruff format --check src tests tools

    - name: Type check (mypy)
      run: uv run --locked mypy src

    - name: Type check tests (mypy)
      run: uv run --locked mypy tests --allow-untyped-defs --check-untyped-defs

    - name: Guard sensitive CLI output
      run: uv run --locked python tools/check_sensitive_output.py

    - name: Verify passphrase generation strength
      run: |
        uv run --locked python - <<'PY'
        from secure_string_cipher.passphrase_generator import generate_passphrase
        from secure_string_cipher.timing_safe import check_password_strength

        for _ in range(200):
            passphrase, _ = generate_passphrase("alphanumeric", length=24)
            is_valid, message = check_password_strength(passphrase)
            if not is_valid:
                raise SystemExit(f"Generated passphrase failed strength check: {message}")
        print("Inline passphrase generation consistently meets strength requirements.")
        PY

    - name: Security scan - Secrets
      run: |
        git ls-files -z -- ':!:package.lock.json' |
          xargs -0 uv run --locked detect-secrets-hook --baseline .secrets.baseline
        git diff --exit-code -- .secrets.baseline

    - name: Security scan - Production Vulnerabilities
      run: make dependency-audit

    - name: Build package
      run: make build

  # Test matrix runs in parallel after quality checks pass
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.9.17"
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked)
      run: uv sync --extra dev --locked

    - name: Run tests (with coverage on 3.14)
      run: |
        # Benchmarks assert on wall-clock timings and compete with -n auto's
        # parallel workers for CPU, making them a source of unrelated CI
        # flakiness rather than a release gate; run separately (see the
        # benchmarks job below), never as a condition of merging.
        if [ "${{ matrix.python-version }}" = "3.14" ]; then
          uv run --locked pytest tests/ -m "not benchmark" \
            --cov=secure_string_cipher \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            --cov-report=xml \
            --cov-fail-under=85
        else
          uv run --locked pytest tests/ -m "not benchmark"
        fi

  platform-safety:
    name: Platform Safety (${{ matrix.os }} - ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.9.17"
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked)
      run: uv sync --extra dev --locked

    - name: Run focused platform safety tests
      run: >-
        uv run --locked pytest
        tests/integration/test_legacy_fixtures.py
        tests/integration/test_platform_safety.py
        tests/unit/test_file_size_limits.py
        tests/unit/test_vault_transport.py
        tests/unit/test_vault_candidate_validation.py
        tests/unit/test_vault_transactions.py
        tests/unit/test_v2_vault_transactions.py
        tests/unit/test_v2_output_safety.py
        tests/unit/test_v2_keyfile.py
        -n 0

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    needs: quality
    # Timing assertions are inherently noisy on shared CI runners -- this job
    # never gates merging. It exists so a severe regression is at least
    # visible in the log, not to enforce a threshold.
    continue-on-error: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.14"
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.9.17"
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked)
      run: uv sync --extra dev --locked

    - name: Run benchmarks
      run: uv run --locked pytest tests/ -m benchmark -n 0

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: actionlint
      uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
      with:
        fail_level: error

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Dependency review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high

  wheel-smoke-test:
    name: Install the built wheel and smoke-test it
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.14"
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.9.17"
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked, for the build step only)
      run: uv sync --extra dev --locked

    - name: Build wheel
      run: make build

    - name: twine check
      run: uvx twine check --strict dist/*.whl

    # This is the actual point of the job: everything above builds and
    # statically inspects the wheel, same as `quality`'s existing build
    # step and release.yml's own artifact checks -- neither of them ever
    # installs it or runs the result. A missing module, a broken entry
    # point, or a bad dependency pin would reach PyPI undetected without
    # this. The venv below has no dev extras and is not the repo checkout's
    # own environment, so nothing here can accidentally succeed only
    # because src/ happens to be importable some other way.
    - name: Install the wheel into a fresh venv (no dev extras)
      run: |
        python -m venv /tmp/wheel-smoke-venv
        /tmp/wheel-smoke-venv/bin/pip install --quiet --upgrade pip
        wheel="$(ls dist/*.whl)"
        /tmp/wheel-smoke-venv/bin/pip install --quiet "$wheel"

    - name: Smoke-test the installed package
      run: |
        venv=/tmp/wheel-smoke-venv/bin
        "$venv/ssc" --version
        "$venv/ssc" --help > /dev/null
        "$venv/python" -c "import secure_string_cipher; import secure_string_cipher.v2"

        # A real encrypt-then-decrypt round trip through the installed CLI,
        # not the repository checkout -- proves the packaged entry point,
        # its declared dependencies, and the v2 code path all actually work
        # together as shipped, not just as importable modules. A real
        # regular file for the password, not process substitution: the
        # password-file reader deliberately requires a regular file
        # (O_NOFOLLOW + an fstat S_ISREG check), so a /dev/fd/N pipe is
        # correctly refused here, not a usable shortcut.
        pwfile="$(mktemp)"
        trap 'rm -f "$pwfile"' EXIT
        chmod 600 "$pwfile"
        printf '%s' "Str0ngSmokeTest!2026" > "$pwfile"

        message="wheel smoke test $(date +%s)"
        armored="$("$venv/ssc" --password-file "$pwfile" encrypt -t "$message" --with password)"
        decrypted="$("$venv/ssc" --password-file "$pwfile" decrypt -t "$armored")"
        if [ "$decrypted" != "$message" ]; then
          echo "Round-trip mismatch: expected '$message', got '$decrypted'" >&2
          exit 1
        fi
        echo "Wheel smoke test passed: $message"
