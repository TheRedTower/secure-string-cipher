name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Set up Python 3.14
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "3.14"
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked)
      run: uv sync --extra dev --locked

    - name: Check code quality (Ruff)
      run: uv run --locked ruff check src tests tools

    - name: Check formatting (Ruff)
      run: uv run --locked ruff format --check src tests tools

    - name: Type check (mypy)
      run: uv run --locked mypy src

    - name: Guard sensitive CLI output
      run: uv run --locked python tools/check_sensitive_output.py

    - name: Test sensitive-output regressions
      run: |
        uv run --locked pytest \
          tests/unit/test_cli_coverage.py \
          tests/unit/test_cli_menu.py \
          tests/unit/test_cli_args_coverage.py \
          tests/security/test_audit_log.py

    - name: Security scan - Secrets
      run: |
        git ls-files -z -- ':!:package.lock.json' |
          xargs -0 uv run --locked detect-secrets-hook --baseline .secrets.baseline
        git diff --exit-code -- .secrets.baseline

    - name: Build package
      run: uv build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      with:
        body_path: ${{ github.workspace }}/CHANGELOG.md
        files: dist/*
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
      with:
        skip-existing: true

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      with:
        # Enable BuildKit features for better caching
        buildkitd-flags: --allow-insecure-entitlement network.host

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Multi-layer caching for maximum speed
        cache-from: |
          type=gha,scope=buildkit
          type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
        cache-to: type=gha,mode=max,scope=buildkit
        build-args: |
          SSC_VERSION=${{ steps.meta.outputs.version }}
          BUILDKIT_INLINE_CACHE=1
          BUILDKIT_PROGRESS=plain
