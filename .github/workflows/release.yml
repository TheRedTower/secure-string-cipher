name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked)
      run: uv sync --extra dev --locked

    - name: Check code quality (Ruff)
      run: uv run --locked ruff check src tests tools

    - name: Check formatting (Ruff)
      run: uv run --locked ruff format --check src tests tools

    - name: Type check (mypy)
      run: uv run --locked mypy src

    - name: Guard sensitive CLI output
      run: uv run --locked python tools/check_sensitive_output.py

    - name: Test sensitive-output regressions
      run: |
        uv run --locked pytest \
          tests/unit/test_cli_coverage.py \
          tests/unit/test_cli_menu.py \
          tests/unit/test_cli_args_coverage.py \
          tests/security/test_audit_log.py

    - name: Security scan - Secrets
      run: uv run --locked detect-secrets scan --baseline .secrets.baseline

    - name: Build package
      run: uv build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        body_path: ${{ github.workspace }}/CHANGELOG.md
        files: dist/*
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        # Enable BuildKit features for better caching
        buildkitd-flags: --allow-insecure-entitlement network.host

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Multi-layer caching for maximum speed
        cache-from: |
          type=gha,scope=buildkit
          type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
        cache-to: type=gha,mode=max,scope=buildkit
        build-args: |
          SSC_VERSION=${{ steps.meta.outputs.version }}
          BUILDKIT_INLINE_CACHE=1
          BUILDKIT_PROGRESS=plain
