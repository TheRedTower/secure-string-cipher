name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Verify release source
      env:
        RELEASE_REF_TYPE: ${{ github.ref_type }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        if [ "$RELEASE_REF_TYPE" != "tag" ] || [ "${RELEASE_TAG#v}" = "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "v" ]; then
          echo "Releases must run from a version tag prefixed with 'v'." >&2
          exit 1
        fi
        git fetch --no-tags origin main
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
          echo "The tagged commit must match the current protected main commit." >&2
          exit 1
        fi

    - name: Set up Python 3.14
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "3.14"
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.9.17"
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Sync (locked)
      run: uv sync --extra dev --locked

    - name: Check code quality (Ruff)
      run: uv run --locked ruff check src tests tools

    - name: Check formatting (Ruff)
      run: uv run --locked ruff format --check src tests tools

    - name: Type check (mypy)
      run: uv run --locked mypy src

    - name: Guard sensitive CLI output
      run: uv run --locked python tools/check_sensitive_output.py

    - name: Test sensitive-output regressions
      run: |
        uv run --locked pytest \
          tests/unit/test_cli_coverage.py \
          tests/unit/test_cli_menu.py \
          tests/unit/test_cli_args_coverage.py \
          tests/security/test_audit_log.py

    - name: Security scan - Secrets
      run: |
        git ls-files -z -- ':!:package.lock.json' |
          xargs -0 uv run --locked detect-secrets-hook --baseline .secrets.baseline
        git diff --exit-code -- .secrets.baseline

    - name: Security scan - Production Vulnerabilities
      run: |
        audit_requirements="$(mktemp)"
        trap 'rm -f "$audit_requirements"' EXIT
        uv export --quiet --locked --no-dev --no-emit-project \
          --output-file "$audit_requirements"
        uv run --locked pip-audit --requirement "$audit_requirements" \
          --require-hashes --disable-pip --desc

    - name: Build package
      run: make build DIST_DIR=release-dist

    - name: Verify release tag and package artifacts
      env:
        RELEASE_REF_TYPE: ${{ github.ref_type }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        uv run --locked python - <<'PY'
        from email.parser import BytesParser
        import os
        from pathlib import Path, PurePosixPath
        import tarfile
        import tomllib
        import zipfile

        ref_type = os.environ["RELEASE_REF_TYPE"]
        tag = os.environ["RELEASE_TAG"]
        if ref_type != "tag" or not tag.startswith("v") or len(tag) == 1:
            raise SystemExit("Releases must run from a version tag prefixed with 'v'.")

        with Path("pyproject.toml").open("rb") as project_file:
            project_version = tomllib.load(project_file)["project"]["version"]
        tag_version = tag.removeprefix("v")
        if tag_version != project_version:
            raise SystemExit(
                f"Tag version {tag_version!r} does not match project version "
                f"{project_version!r}."
            )

        dist = Path("release-dist")
        files = sorted(path for path in dist.iterdir() if path.is_file())
        wheels = [path for path in files if path.suffix == ".whl"]
        sdists = [path for path in files if path.name.endswith(".tar.gz")]
        unexpected = [path for path in files if path not in {*wheels, *sdists}]
        if len(wheels) != 1 or len(sdists) != 1 or unexpected:
            names = ", ".join(path.name for path in files) or "<none>"
            raise SystemExit(
                "Expected exactly one wheel and one source distribution; "
                f"found: {names}."
            )

        with zipfile.ZipFile(wheels[0]) as wheel:
            if any(
                {"_local", ".git", ".venv"} & set(PurePosixPath(name).parts)
                for name in wheel.namelist()
            ):
                raise SystemExit("Wheel contains private working files.")
            metadata_names = [
                name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
            ]
            if len(metadata_names) != 1:
                raise SystemExit("Wheel must contain exactly one METADATA file.")
            wheel_metadata = BytesParser().parsebytes(wheel.read(metadata_names[0]))

        with tarfile.open(sdists[0], mode="r:gz") as sdist:
            if any(
                {"_local", ".git", ".venv"} & set(PurePosixPath(name).parts)
                for name in sdist.getnames()
            ):
                raise SystemExit("Source distribution contains private working files.")
            metadata_members = [
                member
                for member in sdist.getmembers()
                if member.isfile()
                and PurePosixPath(member.name).name == "PKG-INFO"
                and len(PurePosixPath(member.name).parts) == 2
            ]
            if len(metadata_members) != 1:
                raise SystemExit("Source distribution must contain one top-level PKG-INFO.")
            metadata_file = sdist.extractfile(metadata_members[0])
            if metadata_file is None:
                raise SystemExit("Could not read source distribution metadata.")
            sdist_metadata = BytesParser().parsebytes(metadata_file.read())

        artifact_versions = {
            wheels[0].name: wheel_metadata["Version"],
            sdists[0].name: sdist_metadata["Version"],
        }
        mismatches = {
            name: version
            for name, version in artifact_versions.items()
            if version != project_version
        }
        if mismatches:
            raise SystemExit(
                "Built artifact versions do not match the project version: "
                f"{mismatches}."
            )

        print(f"Verified tag, project, wheel, and sdist version: {project_version}")
        PY

    - name: Store verified distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-distributions
        path: |
          release-dist/*.whl
          release-dist/*.tar.gz
        if-no-files-found: error
        retention-days: 7

  publish-pypi:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-distributions
        path: release-dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
      with:
        packages-dir: release-dist/

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-distributions
        path: release-dist/

    - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      with:
        files: |
          release-dist/*.whl
          release-dist/*.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
        overwrite_files: false

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      with:
        # Enable BuildKit features for better caching
        buildkitd-flags: --allow-insecure-entitlement network.host

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Multi-layer caching for maximum speed
        cache-from: |
          type=gha,scope=buildkit
          type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
        cache-to: type=gha,mode=max,scope=buildkit
        build-args: |
          SSC_VERSION=${{ steps.meta.outputs.version }}
          BUILDKIT_INLINE_CACHE=1
          BUILDKIT_PROGRESS=plain
